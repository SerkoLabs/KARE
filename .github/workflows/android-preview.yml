name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [feat/foundation]
    paths:
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KARE-preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KARE-preview-apk
          path: KARE-preview.apk
          if-no-files-found: error
          retention-days: 14
