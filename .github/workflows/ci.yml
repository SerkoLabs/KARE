name: KARE quality gate
on:
  push:
    branches: [feat/foundation]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run gates and report failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          failed=0
          printf '## CI diagnostics for `%s`\n\n' "$GITHUB_SHA" > /tmp/diag.md
          for gate in lint typecheck test:ci export:smoke; do
            output=$(npm run "$gate" 2>&1)
            status=$?
            if [ $status -ne 0 ]; then
              failed=1
              printf '### `%s` failed\n```text\n%s\n```\n\n' "$gate" "$output" >> /tmp/diag.md
            else
              printf '### `%s` passed\n\n' "$gate" >> /tmp/diag.md
            fi
          done
          gh pr comment 1 --body-file /tmp/diag.md
          exit $failed
